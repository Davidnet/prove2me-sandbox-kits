# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Prove2Me Claude Code workload
description: Claude Code v3 workload for use with the Prove2Me Lean mixin
version: "0.1.1"

args:
  model:
    default: sonnet
    enum: [sonnet, opus, haiku]

capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/resources@1
    config:
      cpu: 4
      memory: 8g
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.anthropic.com:443
  - type: com.docker.sandbox/credential@1
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - domain: api.anthropic.com
            header: x-api-key
            format: "%s"
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: CLAUDE.md
  - type: com.docker.sandbox/lifecycle@1
    config:
      files:
        - path: /home/agent/.config/prove2me-claude/settings.json
          content: |
            {"model": "${{ kit.args.model }}"}
          mode: "0644"
