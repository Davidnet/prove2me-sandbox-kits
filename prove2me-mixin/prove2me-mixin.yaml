# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Prove2Me Lean toolchain
description: Lean 4 and cached Mathlib setup for Prove2Me missions
version: "0.1.1"
provides: ["prove2me-lean@4.33.1"]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - elan.lean-lang.org:443
          - release.lean-lang.org:443
          - releases.lean-lang.org:443
          - github.com:443
          - raw.githubusercontent.com:443
          - objects.githubusercontent.com:443
          - release-assets.githubusercontent.com:443
          - lakecache.blob.core.windows.net:443
      runtime:
        allow:
          - prove2.me:443
          - github.com:443
          - raw.githubusercontent.com:443
          - objects.githubusercontent.com:443
          - releases.lean-lang.org:443
          - release.lean-lang.org:443
          - release-assets.githubusercontent.com:443
          - lakecache.blob.core.windows.net:443
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: bash /usr/local/share/prove2me/bootstrap.sh
          user: "1000"
        - command: |
            for tool in elan lean lake; do
              if [ ! -e "/usr/local/bin/$tool" ]; then
                ln -s "/home/agent/.elan/bin/$tool" "/usr/local/bin/$tool"
              fi
            done
          user: "0"
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./context.md
